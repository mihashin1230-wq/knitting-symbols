<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
#dm{--dm-line:#d9d9d9;--dm-soft:#f5f5f5;--dm-ink:#222;--dm-accent:#2f6df6;font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;color:var(--dm-ink);max-width:1120px;margin:0 auto;padding:12px}
#dm *{box-sizing:border-box}
#dm button,#dm select,#dm input{font:inherit;color:inherit}
#dm .dm-layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
#dm .dm-pal{border:1px solid var(--dm-line);border-radius:10px;padding:10px;background:#fff}
#dm .dm-tabs{display:flex;gap:6px;margin-bottom:8px}
#dm .dm-tab{flex:1;padding:8px 0;border:1px solid var(--dm-line);border-radius:8px;background:#fff;cursor:pointer}
#dm .dm-tab.on{background:var(--dm-ink);color:#fff;border-color:var(--dm-ink)}
#dm .dm-filters{display:flex;gap:6px;margin-bottom:8px}
#dm .dm-filters select,#dm .dm-filters input{min-width:0;flex:1;padding:7px 8px;border:1px solid var(--dm-line);border-radius:8px;background:#fff}
#dm .dm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;max-height:640px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#dm .dm-sym{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:1px solid var(--dm-line);border-radius:8px;background:#fff;cursor:pointer}
#dm .dm-sym:hover,#dm .dm-sym:active{border-color:var(--dm-accent);background:#f3f7ff}
#dm .dm-sym img{width:44px;height:44px;display:block}
#dm .dm-sym span{font-size:10px;line-height:1.2;text-align:center;word-break:keep-all;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#dm .dm-empty{grid-column:1/-1;padding:24px 0;text-align:center;color:#888;font-size:13px}
#dm .dm-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
#dm .dm-btn{padding:7px 10px;border:1px solid var(--dm-line);border-radius:8px;background:#fff;cursor:pointer;font-size:13px}
#dm .dm-btn:disabled{opacity:.35;cursor:default}
#dm .dm-btn.main{background:var(--dm-ink);color:#fff;border-color:var(--dm-ink);margin-left:auto}
#dm .dm-chk{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:0 4px}
#dm .dm-wrap{width:100%;position:relative;overflow:auto;border:1px solid var(--dm-line);border-radius:10px;background:#fff}
#dm .dm-stage{position:absolute;left:0;top:0;transform-origin:0 0}
#dm .dm-stage.grid{background-image:linear-gradient(#e4e4e4 1px,transparent 1px),linear-gradient(90deg,#e4e4e4 1px,transparent 1px);background-size:60px 60px}
#dm .dm-item{position:absolute;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#dm .dm-item img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
#dm .dm-item.sel{outline:2px dashed var(--dm-accent);outline-offset:2px}
#dm .dm-rot-handle{display:none;position:absolute;left:50%;top:-28px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--dm-accent);border:2px solid #fff;box-shadow:0 0 0 1px var(--dm-accent);cursor:grab;touch-action:none}
#dm .dm-rot-handle::before{content:'';position:absolute;left:50%;top:100%;width:2px;height:14px;margin-left:-1px;background:var(--dm-accent)}
#dm .dm-item.sel .dm-rot-handle{display:block}
#dm .dm-angle{position:absolute;pointer-events:none;background:var(--dm-ink);color:#fff;font-size:11px;padding:2px 6px;border-radius:10px;transform:translate(-50%,-130%);white-space:nowrap}
#dm .dm-hint{margin:8px 2px 0;font-size:12px;color:#777}
@media(max-width:800px){
  #dm .dm-layout{grid-template-columns:1fr}
  #dm .dm-stage-col{order:-1}
  #dm .dm-grid{max-height:38vh}
  #dm .dm-btn.main{margin-left:0;width:100%}
}
</style>

<div id="dm">
  <div class="dm-layout">
    <section class="dm-pal">
      <div class="dm-tabs" id="dmTabs"></div>
      <div class="dm-filters">
        <select id="dmCat" aria-label="분류"></select>
        <input id="dmQ" type="search" placeholder="기호 검색" aria-label="기호 검색">
      </div>
      <div class="dm-grid" id="dmGrid"></div>
    </section>
    <section class="dm-stage-col">
      <div class="dm-toolbar">
        <button class="dm-btn" id="dmRotL" disabled>&#8634; 15°</button>
        <button class="dm-btn" id="dmRotR" disabled>&#8635; 15°</button>
        <button class="dm-btn" id="dmRot90" disabled>90° 회전</button>
        <button class="dm-btn" id="dmSmall" disabled>작게 &minus;</button>
        <button class="dm-btn" id="dmBig" disabled>크게 +</button>
        <button class="dm-btn" id="dmDup" disabled>복제</button>
        <button class="dm-btn" id="dmDel" disabled>삭제</button>
        <span class="dm-chk">가로<input type="number" id="dmW" value="10" min="2" max="120" style="width:56px;padding:6px 4px;border:1px solid var(--dm-line);border-radius:6px">칸</span>
        <span class="dm-chk">세로<input type="number" id="dmH" value="10" min="2" max="120" style="width:56px;padding:6px 4px;border:1px solid var(--dm-line);border-radius:6px">칸</span>
        <button class="dm-btn" id="dmSizeApply">칸 수 적용</button>
        <label class="dm-chk"><input type="checkbox" id="dmSnap" checked>격자에 맞춤</label>
        <label class="dm-chk"><input type="checkbox" id="dmGridShow" checked>격자 표시</label>
        <button class="dm-btn" id="dmClear">전체 지우기</button>
        <button class="dm-btn main" id="dmSave">이미지로 저장</button>
      </div>
      <div class="dm-toolbar">
        <button class="dm-btn" id="dmZoomOut">화면 축소 &minus;</button>
        <span class="dm-chk" id="dmZoomPct">100%</span>
        <button class="dm-btn" id="dmZoomIn">화면 확대 +</button>
        <button class="dm-btn" id="dmZoomFit">화면 맞춤</button>
      </div>
      <div class="dm-wrap" id="dmWrap"><div class="dm-stage grid" id="dmStage"></div></div>
      <p class="dm-hint">기호를 누르면 도안에 추가됩니다. 끌어서 옮기고, 선택하면 위에 파란 손잡이가 생겨요 &mdash; 손잡이를 끌면 원하는 각도로 자유롭게 돌릴 수 있습니다 (Shift를 누른 채 돌리면 15&deg;씩 딱딱 맞춰집니다). 위 버튼으로도 회전·크기 조절이 됩니다.</p>
    </section>
  </div>
</div>

        c.strokeStyle='#e4e4e4'; c.lineWidth=1/K*1.5; c.beginPath();
        for(var gx=Math.ceil(minX/CELL)*CELL;gx<=maxX;gx+=CELL){c.moveTo(gx,minY);c.lineTo(gx,maxY)}
        for(var gy=Math.ceil(minY/CELL)*CELL;gy<=maxY;gy+=CELL){c.moveTo(minX,gy);c.lineTo(maxX,gy)}
        c.stroke();
      }
      pairs.forEach(function(p){
        var it=p.it;
        c.save(); c.translate(it.x,it.y); c.rotate(it.rot*Math.PI/180);
        c.drawImage(p.im,-it.size/2,-it.size/2,it.size,it.size);
        c.restore();
      });
      cv.toBlob(function(b){
        var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='도안.png';
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
      },'image/png');
    }).catch(function(){alert('이미지를 저장하지 못했습니다. 기호 이미지 서버가 다른 사이트에서의 사용을 허용하지 않는 경우일 수 있습니다.')});
  };

  renderTabs(); renderCats(); renderGrid(); fit();
  window.addEventListener('load',fit);
  [200,600,1200,2500].forEach(function(t){setTimeout(fit,t)});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)fit()});
  if(window.IntersectionObserver){
    new IntersectionObserver(function(entries){
      entries.forEach(function(e){if(e.isIntersecting)fit()});
    }).observe(wrap);
  }
})();
</script>
